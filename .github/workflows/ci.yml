name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Exactly what `tauri build` runs as beforeBuildCommand (tsc -b && vite build),
      # so a tag build can't be broken by a frontend error CI never saw.
      - run: npm run build

      - run: npm test
