# At the repo root rather than in src-tauri/ because cargo looks for this from
# the directory it's run in, and the documented test command runs from here.

[env]
# Where the TypeScript mirror of the wire types goes — see `npm run bindings`.
TS_RS_EXPORT_DIR = { value = "src/lib/bindings", relative = true }
# u64 and i64 cross the bridge as JSON numbers, and `JSON.parse` hands them
# back as `number`. ts-rs would otherwise call them `bigint`.
TS_RS_LARGE_INT = "number"
